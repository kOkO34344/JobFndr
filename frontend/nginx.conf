server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA routes are client-side; anything not on disk falls through to index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser runs on the host and cannot resolve "backend"; nginx can,
    # because it sits on the compose network. This keeps the app same-origin.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A scan fans out to every source and then embeds; it can legitimately
        # take minutes. The default 60s would cut it off mid-run.
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
